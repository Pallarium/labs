<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:640px; background:#07070a; font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; position:relative; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(0,255,190,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,190,.045) 1px,transparent 1px); background-size:54px 54px; }
  .glow { position:absolute; width:820px; height:820px; border-radius:50%; background:radial-gradient(circle,rgba(0,255,190,.14),transparent 68%); top:-300px; right:-240px; filter:blur(10px); }
  .glow2 { position:absolute; width:620px; height:620px; border-radius:50%; background:radial-gradient(circle,rgba(150,120,255,.10),transparent 70%); bottom:-280px; left:-180px; filter:blur(10px); }
  .wrap { position:relative; padding:70px 78px; height:100%; display:flex; flex-direction:column; }
  .tag { font-size:19px; letter-spacing:.32em; color:#00ffbe; text-transform:uppercase; font-weight:700; }
  .rule { height:2px; background:linear-gradient(90deg,#00ffbe,transparent); margin:22px 0 40px; }
  h1 { font-size:88px; line-height:1; color:#fff; font-weight:800; letter-spacing:-.04em; }
  h1 em { font-style:normal; color:#00ffbe; }
  .body { margin-top:28px; font-size:29px; line-height:1.45; color:#c3ced6; max-width:900px; }
  .body b { color:#fff; font-weight:700; }
  .stats { margin-top:auto; display:flex; gap:64px; border-top:1px solid #1d2329; padding-top:32px; align-items:flex-end; }
  .stat b { display:block; font-size:52px; font-weight:900; color:#00ffbe; letter-spacing:-.04em; line-height:1; text-shadow:0 0 50px rgba(0,255,190,.4); }
  .stat span { font-size:17px; color:#6e7a84; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  .handle { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#00ffbe; box-shadow:0 0 22px #00ffbe; }
  .handle span { font-size:27px; color:#6e7a84; letter-spacing:.06em; font-weight:600; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="tag">pallarium labs</div>
    <div class="rule"></div>
    <h1>14 live demos.<br><em>zero dependencies.</em></h1>
    <div class="body">Shaders, particles, fluid fields and generative scenes. Every one is a <b>single self contained file</b> you can open and read top to bottom.</div>
    <div class="stats">
      <div class="stat"><b>14</b><span>Demos</span></div>
      <div class="stat"><b>0</b><span>npm installs</span></div>
      <div class="stat"><b>0</b><span>Build steps</span></div>
      <div class="handle"><div class="dot"></div><span>@pallarium</span></div>
    </div>
  </div>
</body>
</html>
