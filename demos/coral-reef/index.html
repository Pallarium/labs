<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Coral Reef</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#01141f}
  #gl{display:block;width:100vw;height:100vh}
  #hint{
    position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font:600 12px/1.4 'Segoe UI',system-ui,sans-serif;
    letter-spacing:.28em;text-transform:uppercase;
    color:rgba(180,235,255,.55);text-shadow:0 0 10px rgba(0,140,180,.6);
    pointer-events:none;user-select:none;z-index:5;
    transition:opacity 1.2s ease;
  }
  #hint.gone{opacity:0}
  #fps{
    position:fixed;top:10px;left:12px;z-index:5;
    font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;
    color:rgba(150,225,255,.5);text-shadow:0 0 8px rgba(0,120,160,.7);
    pointer-events:none;user-select:none;
  }
  #err{
    position:fixed;inset:0;display:none;place-items:center;padding:6vw;z-index:9;
    font:14px/1.6 ui-monospace,monospace;color:#ff9db0;background:#01141f;
    white-space:pre-wrap;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fps">— fps</div>
<div id="hint">move the cursor · drift through the reef</div>
<div id="err"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
