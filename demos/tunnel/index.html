<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tunnel // raymarched</title>
<style>
:root{ --bg:#120e17; --surface:#201a28; --ink:#e5e4e8; --muted:#9e95a9; --hairline:#332740; --accent:#dad45d; --accent-2:#60d959; --warn:#f5be3d; --error:#ec5651; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(var(--hairline) 1px, transparent 1px) 0 0/22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:'Fira Code', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

.wordmark{
  position:fixed;top:14px;left:16px;z-index:3;
  font-size:11px;letter-spacing:.5px;color:var(--muted);
  text-transform:lowercase;user-select:none;
}
.wordmark b{color:var(--ink);font-weight:600}

.panel{
  position:fixed;top:44px;left:16px;z-index:3;
  width:250px;background:var(--surface);
  border:2px solid var(--hairline);border-radius:8px;
  padding:18px 16px 16px;
}
.panel h2{
  font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;
}
.ctrl{margin-bottom:18px}
.ctrl:last-child{margin-bottom:4px}
.ctrl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctrl label{font-size:12px;color:var(--ink);text-transform:lowercase}
.ctrl .val{font-size:11px;color:var(--accent)}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:2px;
  background:var(--hairline);border-radius:8px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:pointer;
  transition:transform .15s ease;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:2px solid var(--bg);cursor:pointer;
}

.hint{
  position:fixed;bottom:14px;left:16px;z-index:3;
  font-size:11px;color:var(--muted);user-select:none;
}
.hint b{color:var(--accent-2)}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="wordmark"><b>tunnel</b> // raymarched</div>

<div class="panel">
  <h2>controls</h2>
  <div class="ctrl">
    <div class="row"><label>palette shift</label><span class="val" id="v-shift">0.00</span></div>
    <input type="range" id="shift" min="0" max="1" step="0.001" value="0">
  </div>
  <div class="ctrl">
    <div class="row"><label>flight speed</label><span class="val" id="v-speed">2.40</span></div>
    <input type="range" id="speed" min="0" max="8" step="0.01" value="2.4">
  </div>
  <div class="ctrl">
    <div class="row"><label>warp</label><span class="val" id="v-warp">1.00</span></div>
    <input type="range" id="warp" min="0" max="2.5" step="0.01" value="1.0">
  </div>
</div>

<div class="hint">move the <b>mouse</b> to steer</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false });
if(!gl){ document.body.innerHTML = '<p style="color:var(--error);padding:40px;font-family:monospace">WebGL2 not available in this browser.</p>'; }

const VERT = `#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0., 1.); }`;

const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;   // 0..1, eased
uniform float uShift;  // palette offset
uniform float uSpeed;
uniform float uWarp;

// IQ cosine palette
vec3 pal(float t){
  return 0.5 + 0.45*cos(6.28318*(vec3(1.0)*t + vec3(0.0,0.33,0.67) + uShift));
}

vec2 path(float z){
  vec2 wobble = vec2(sin(z*0.35), cos(z*0.27)) * (1.2*uWarp);
  return wobble + (uMouse-0.5)*3.4;
}

float map(vec3 p){
  vec2 c = path(p.z);
  vec2 q = p.xy - c;
  float r = length(q);
  float ang = atan(q.y, q.x);
  float wall = 1.7 - r;                                  // signed dist to tunnel wall
  wall += 0.20*sin(8.0*ang + p.z*0.6 + uTime*1.4);       // fluted ribs
  wall += 0.09*sin(p.z*3.0 - uTime*2.0);                 // travelling rings
  return wall;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 ro = vec3(0.0, 0.0, uTime*uSpeed);
  vec2 st = uMouse - 0.5;
  vec3 rd = normalize(vec3(uv + st*0.7, 1.0));

  float t = 0.1, glow = 0.0;
  bool hit = false;
  for(int i=0;i<110;i++){
    vec3 p = ro + rd*t;
    float d = map(p);
    glow += 0.010/(abs(d)+0.08);
    if(d < 0.003){ hit = true; break; }
    t += max(d*0.7, 0.015);
    if(t > 40.0) break;
  }

  vec3 col = vec3(0.0);
  if(hit){
    vec3 p = ro + rd*t;
    vec2 c = path(p.z);
    vec2 q = p.xy - c;
    float ang = atan(q.y, q.x);
    float shade = t*0.045 + ang*0.18 + p.z*0.03;

    vec3 base = pal(shade);
    float rib = 0.55 + 0.45*sin(8.0*ang + p.z*0.6 + uTime*1.4);  // wall banding
    col = base * rib;
    col *= exp(-t*0.11);                 // hard depth falloff -> black core
  }
  col += pal(uTime*0.05 + 0.2) * glow*glow * 0.02;  // glowing veins, squared for contrast
  col *= 1.0 - 0.42*dot(uv,uv);          // vignette
  col = col/(1.0+col);                   // reinhard tonemap
  col = pow(col, vec3(0.4545));          // gamma
  outColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

const U = {
  res:   gl.getUniformLocation(prog, 'uRes'),
  time:  gl.getUniformLocation(prog, 'uTime'),
  mouse: gl.getUniformLocation(prog, 'uMouse'),
  shift: gl.getUniformLocation(prog, 'uShift'),
  speed: gl.getUniformLocation(prog, 'uSpeed'),
  warp:  gl.getUniformLocation(prog, 'uWarp'),
};

const state = { shift:0, speed:2.4, warp:1.0 };
function bind(id, key, fmt){
  const el = document.getElementById(id);
  const out = document.getElementById('v-'+id);
  const upd = () => { state[key] = parseFloat(el.value); out.textContent = fmt(state[key]); };
  el.addEventListener('input', upd); upd();
}
bind('shift','shift', v=>v.toFixed(2));
bind('speed','speed', v=>v.toFixed(2));
bind('warp', 'warp',  v=>v.toFixed(2));

// mouse (eased toward target so the picture rests)
const mouse = { tx:0.5, ty:0.5, x:0.5, y:0.5 };
addEventListener('pointermove', e=>{
  mouse.tx = e.clientX/innerWidth;
  mouse.ty = 1.0 - e.clientY/innerHeight;
});

function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize);
resize();

const start = performance.now();
function frame(now){
  mouse.x += (mouse.tx - mouse.x)*0.06;
  mouse.y += (mouse.ty - mouse.y)*0.06;
  gl.uniform2f(U.res, canvas.width, canvas.height);
  gl.uniform1f(U.time, (now-start)/1000);
  gl.uniform2f(U.mouse, mouse.x, mouse.y);
  gl.uniform1f(U.shift, state.shift);
  gl.uniform1f(U.speed, state.speed);
  gl.uniform1f(U.warp,  state.warp);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
