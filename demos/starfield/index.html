<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warp Starfield</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #030308; }
  canvas { display: block; cursor: crosshair; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #556; font: 12px/1.4 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 2px; text-transform: uppercase; pointer-events: none;
    opacity: .7; transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move mouse to steer</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  CX = W / 2; CY = H / 2;
}
resize();
addEventListener('resize', resize);

const STAR_COUNT = 600;
const DEPTH = 1400;
const stars = [];

function spawn(s, randomZ) {
  s.x = (Math.random() - 0.5) * W * 2.5;
  s.y = (Math.random() - 0.5) * H * 2.5;
  s.z = randomZ ? Math.random() * DEPTH : DEPTH;
  s.pz = s.z;
  // subtle color variation: white, blue-white, warm
  const t = Math.random();
  s.hue = t < 0.7 ? 220 : t < 0.9 ? 200 : 40;
  s.sat = Math.random() * 40;
  return s;
}
for (let i = 0; i < STAR_COUNT; i++) stars.push(spawn({}, true));

// mouse steering — offset the vanishing point, eased
let mx = 0, my = 0, steerX = 0, steerY = 0;
addEventListener('mousemove', e => {
  mx = (e.clientX / W - 0.5) * 2;   // -1 .. 1
  my = (e.clientY / H - 0.5) * 2;
  document.getElementById('hint').style.opacity = 0;
});

let speed = 14;

function frame() {
  // ease steering toward mouse
  steerX += (mx - steerX) * 0.05;
  steerY += (my - steerY) * 0.05;

  // motion-blur fade
  ctx.fillStyle = 'rgba(3, 3, 8, 0.35)';
  ctx.fillRect(0, 0, W, H);

  const vx = CX - steerX * CX * 0.8;  // vanishing point drifts opposite-ish
  const vy = CY - steerY * CY * 0.8;

  ctx.lineCap = 'round';

  for (const s of stars) {
    s.pz = s.z;
    s.z -= speed;
    // lateral drift from steering — stars slide away from where you aim
    s.x += steerX * speed * 2.2;
    s.y += steerY * speed * 2.2;

    if (s.z <= 1) { spawn(s, false); continue; }

    const f  = 300 / s.z;
    const pf = 300 / s.pz;
    const x  = vx + s.x * f;
    const y  = vy + s.y * f;
    const px = vx + s.x * pf;
    const py = vy + s.y * pf;

    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) { spawn(s, false); continue; }

    const depth = 1 - s.z / DEPTH;           // 0 far, 1 near
    const alpha = Math.min(1, depth * 1.4);
    const size = Math.max(0.4, depth * 3);

    ctx.strokeStyle = `hsla(${s.hue}, ${s.sat}%, ${85 + depth * 15}%, ${alpha})`;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
