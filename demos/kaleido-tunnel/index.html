<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALEIDO // SDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#181314; --surface:#272021; --ink:#e7e3e3; --muted:#988282; --hairline:#3c3132; --accent:#d49d6d; --accent-2:#d0629c; --warn:#f5be3d; --error:#ec5651; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'Manrope',system-ui,sans-serif; }
canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }

/* TOP COMMAND BAR */
#bar{
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; gap:14px;
  height:52px; padding:0 14px;
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  border-bottom:2px solid var(--hairline);
  backdrop-filter:blur(6px);
}
#mark{ display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:700; letter-spacing:.5px; }
#glyph{ width:16px; height:16px; border-radius:4px; border:2px solid var(--accent); background:var(--accent-2); box-shadow:3px 3px 0 var(--ink); }
#mark .sub{ color:var(--muted); font-weight:600; font-size:12px; letter-spacing:2px; }
.spacer{ flex:1; }
.ctl{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:12px; letter-spacing:.5px;
  color:var(--ink); background:var(--surface);
  border:2px solid var(--hairline); border-radius:14px;
  padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:8px;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.ctl:hover{ transform:translate(-1px,-1px); border-color:var(--accent); }
.ctl:active{ transform:translate(1px,1px); }
.ctl .dot{ width:10px; height:10px; border-radius:50%; background:var(--muted); transition:background .15s ease; }
.ctl.on{ border-color:var(--accent-2); box-shadow:4px 4px 0 var(--accent-2); }
.ctl.on .dot{ background:var(--warn); }
#read{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:1px; }
#read b{ color:var(--accent); font-family:'Sora',sans-serif; }
#meter{ width:66px; height:8px; border-radius:14px; border:2px solid var(--hairline); overflow:hidden; background:var(--bg); }
#meterFill{ height:100%; width:0%; background:var(--accent-2); transition:width .06s linear; }
input[type=range]{ accent-color:var(--accent); width:88px; }
#err{ position:fixed; inset:auto 0 0 0; z-index:20; display:none; padding:10px 14px; font-family:monospace; font-size:12px; color:var(--error); background:var(--surface); border-top:2px solid var(--error); white-space:pre-wrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="bar">
  <div id="mark"><span id="glyph"></span>KALEIDO<span class="sub">// SDF TUNNEL</span></div>
  <div class="spacer"></div>
  <div id="read">BEAT <div id="meter"><div id="meterFill"></div></div></div>
  <label id="read">BPM <input id="bpm" type="range" min="60" max="180" value="124"> <b id="bpmVal">124</b></label>
  <button class="ctl" id="micBtn"><span class="dot"></span>MIC</button>
</div>

<div id="err"></div>

<script src="main.js"></script>
</body>
</html>
