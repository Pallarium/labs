<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Field — generative flow garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0b0d12; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #c { display:block; position:fixed; inset:0; width:100%; height:100%; cursor:crosshair; }
  .hud {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center;
    background:rgba(18,20,28,.55); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08); border-radius:16px;
    padding:8px 10px; z-index:10;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
    transition:opacity .4s; opacity:1;
  }
  .hud.hide { opacity:0; pointer-events:none; }
  .btn {
    border:none; cursor:pointer; color:#dfe4ee;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07);
    padding:9px 14px; border-radius:11px; font-size:13px; font-weight:600;
    letter-spacing:.2px; transition:.15s; white-space:nowrap;
  }
  .btn:hover { background:rgba(255,255,255,.14); transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .swatch { width:34px; height:34px; border-radius:10px; padding:0; }
  .name {
    color:#9aa3b5; font-size:12px; font-weight:600; padding:0 8px;
    min-width:96px; text-align:center; letter-spacing:.3px;
  }
  .hint {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.4); font-size:12px; letter-spacing:.4px;
    z-index:10; pointer-events:none; transition:opacity 1s; text-align:center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">move your mouse to stir the ink · press <b>H</b> to hide UI</div>
<div class="hud" id="hud">
  <button class="btn swatch" id="swatch" title="cycle palette"></button>
  <span class="name" id="pname">—</span>
  <button class="btn" id="stir">⟳ new field</button>
  <button class="btn" id="clear">clear</button>
  <button class="btn" id="save">⇩ save png</button>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
let DPR = Math.min(window.devicePixelRatio||1, 2);
let W = Math.floor(innerWidth*DPR), H = Math.floor(innerHeight*DPR);
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.width = Math.floor(innerWidth*DPR);
  H = cv.height = Math.floor(innerHeight*DPR);
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  paintBg();
}

/* ---------- palettes ---------- */
const palettes = [
  { name:'Aurora',   bg:'#070b12', cols:['#5eead4','#38bdf8','#a78bfa','#f0abfc','#22d3ee'] },
  { name:'Ember',    bg:'#100704', cols:['#fb7185','#fb923c','#fbbf24','#f43f5e','#fca5a5'] },
  { name:'Mono Ink', bg:'#0a0a0b', cols:['#f8fafc','#cbd5e1','#94a3b8','#e2e8f0','#64748b'] },
  { name:'Lagoon',   bg:'#04120f', cols:['#34d399','#2dd4bf','#67e8f9','#a3e635','#4ade80'] },
  { name:'Ultra',    bg:'#0b0514', cols:['#c084fc','#818cf8','#e879f9','#7dd3fc','#f472b6'] },
];
let pi = 0;
function pal(){ return palettes[pi]; }
function paintBg(){ ctx.fillStyle = pal().bg; ctx.fillRect(0,0,W,H); }

/* ---------- value-noise flow field ---------- */
let seed = Math.random()*1000;
function hash(x,y){
  let n = Math.sin(x*127.1 + y*311.7 + seed)*43758.5453;
  return n - Math.floor(n);
}
function noise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const SCALE = 0.0016;   // field zoom
let flowT = 0;          // slow field drift
function angleAt(x,y){
  return noise(x*SCALE, y*SCALE + flowT) * Math.PI * 4;
}

/* ---------- particles ---------- */
const N = 900;
const parts = [];
function spawn(p){
  p.x = Math.random()*W; p.y = Math.random()*H;
  p.life = 40 + Math.random()*160;
  p.col = pal().cols[(Math.random()*pal().cols.length)|0];
  p.w = 0.5 + Math.random()*1.8*DPR;
}
for(let i=0;i<N;i++){ const p={}; parts.push(p); }  // spawn after resize() sets W/H/DPR

const mouse = { x:-1, y:-1, px:-1, py:-1, active:false };
addEventListener('mousemove', e=>{
  mouse.px=mouse.x; mouse.py=mouse.y;
  mouse.x=e.clientX*DPR; mouse.y=e.clientY*DPR; mouse.active=true;
});
addEventListener('mouseleave', ()=> mouse.active=false);

const SPEED = 1.15*DPR;
function step(){
  ctx.lineCap='round';
  for(let i=0;i<N;i++){
    const p=parts[i];
    let a = angleAt(p.x, p.y);
    let vx = Math.cos(a), vy = Math.sin(a);
    // mouse swirl: push particles tangentially around cursor
    if(mouse.active){
      const dx=p.x-mouse.x, dy=p.y-mouse.y;
      const d2=dx*dx+dy*dy, R=170*DPR;
      if(d2 < R*R){
        const d=Math.sqrt(d2)||1;
        const f=(1 - d/R);
        vx += (-dy/d)*f*2.4;   // tangential = swirl
        vy += ( dx/d)*f*2.4;
      }
    }
    const nl=Math.hypot(vx,vy)||1;
    const nx=p.x + vx/nl*SPEED, ny=p.y + vy/nl*SPEED;

    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=p.col; ctx.globalAlpha=0.5; ctx.lineWidth=p.w;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); ctx.stroke();

    p.x=nx; p.y=ny; p.life--;
    if(p.life<=0 || p.x<0||p.x>W||p.y<0||p.y>H) spawn(p);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  flowT += 0.00035;
}
function loop(){
  try { step(); } catch(err){ console.error('step error:', err); }
  requestAnimationFrame(loop);
}

/* ---------- controls ---------- */
const swatchEl=document.getElementById('swatch');
const pnameEl=document.getElementById('pname');
function applyPalette(){
  const p=pal();
  swatchEl.style.background=`linear-gradient(135deg, ${p.cols[0]}, ${p.cols[2]}, ${p.cols[4]})`;
  pnameEl.textContent=p.name;
}
function newField(hard){
  seed=Math.random()*1000; flowT=Math.random()*10;
  if(hard) paintBg();
  for(const p of parts){ spawn(p); }
}
swatchEl.onclick=()=>{ pi=(pi+1)%palettes.length; applyPalette(); paintBg(); for(const p of parts) spawn(p); };
document.getElementById('stir').onclick=()=>newField(false);
document.getElementById('clear').onclick=()=>{ paintBg(); };
document.getElementById('save').onclick=()=>{
  const a=document.createElement('a');
  a.download='inkfield-'+pal().name.toLowerCase().replace(/\s/g,'')+'-'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png'); a.click();
};

const hud=document.getElementById('hud'), hint=document.getElementById('hint');
addEventListener('keydown', e=>{
  if(e.key==='h'||e.key==='H') hud.classList.toggle('hide');
  if(e.key===' '){ e.preventDefault(); newField(false); }
});
setTimeout(()=>hint.style.opacity=0, 5000);

addEventListener('resize', resize);
resize(); for(const p of parts) spawn(p); applyPalette(); loop();
</script>
</body>
</html>
