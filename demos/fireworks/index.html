<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sparks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{ --bg:#201520; --surface:#2f2130; --ink:#ece9ec; --muted:#98839a; --hairline:#473048; --accent:#cbc454; --accent-2:#63cfc9; --warn:#f5be3d; --error:#ec5651; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 1px 1px, var(--hairline) 1px, transparent 0) 0 0/22px 22px,
    radial-gradient(120% 90% at 50% 0%, var(--surface), var(--bg));
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.wordmark{
  position:fixed;top:16px;left:20px;
  font-family:'Work Sans',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.14em;
  color:var(--muted);text-transform:lowercase;
}
.card{
  width:min(920px,100%);
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:36px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
  padding:20px;
}
.head{
  display:flex;align-items:center;gap:14px;
  padding:6px 10px 16px;
}
.dot{width:14px;height:14px;border-radius:999px;background:var(--accent);flex:none}
.dot.two{background:var(--accent-2)}
.dot.three{background:var(--warn)}
.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:38px;letter-spacing:.06em;line-height:1;
  color:var(--ink);
}
.sub{margin-left:auto;font-size:13px;color:var(--muted)}
.stage{
  position:relative;
  border:1px solid var(--hairline);
  border-radius:28px;
  overflow:hidden;
  background:#180d18;
}
canvas{display:block;width:100%;height:520px;cursor:crosshair}
.hint{
  position:absolute;top:16px;left:18px;
  font-size:13px;color:var(--muted);
  pointer-events:none;
  background:rgba(32,21,32,.55);
  border:1px solid var(--hairline);
  border-radius:999px;
  padding:7px 14px;
}
.bar{
  display:flex;align-items:center;gap:10px;
  padding:16px 10px 6px;flex-wrap:wrap;
}
.chip{
  font-size:12px;letter-spacing:.04em;
  color:var(--muted);
  border:1px solid var(--hairline);
  border-radius:999px;
  padding:8px 14px;
  background:transparent;
  cursor:pointer;
  font-family:'Work Sans',sans-serif;
  font-weight:500;
}
.chip.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chip.gap{margin-left:auto}
.count{font-size:12px;color:var(--muted)}
.count b{color:var(--accent-2);font-weight:600}
</style>
</head>
<body>
<div class="wordmark">sparks</div>
<div class="card">
  <div class="head">
    <span class="dot"></span><span class="dot two"></span><span class="dot three"></span>
    <div class="title">FIREWORKS</div>
    <div class="sub">click the sky</div>
  </div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hint">click anywhere to launch — hold for a barrage</div>
  </div>
  <div class="bar">
    <button class="chip active" data-mode="rings">rings</button>
    <button class="chip" data-mode="willow">willow</button>
    <button class="chip" data-mode="palm">palm</button>
    <button class="chip" data-mode="crackle">crackle</button>
    <button class="chip gap" id="auto">auto-show: off</button>
    <span class="count">live particles <b id="pc">0</b></span>
  </div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const pcEl=document.getElementById('pc');
let DPR=Math.min(devicePixelRatio||1,2);
let W=0,H=0;

function resize(){
  const r=canvas.getBoundingClientRect();
  W=r.width;H=r.height;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(resize).observe(canvas);
resize();

const PALETTE=['#cbc454','#63cfc9','#f5be3d','#ec5651','#ece9ec','#98839a'];
const G=0.05;         // gravity
const AIR=0.986;      // drag

let mode='rings';
let auto=false;
let autoTimer=0;

const rockets=[];
const sparks=[];

function rand(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[(Math.random()*a.length)|0];}

/** Launch a rocket that climbs toward the given target point. */
function launch(tx,ty){
  const sx=rand(W*0.2,W*0.8);
  const sy=H;
  const climb=rand(40,64);
  const dx=(tx-sx)/climb;
  const dy=(ty-sy)/climb - 0.5*G*climb; // aim so apex lands near ty
  rockets.push({x:sx,y:sy,vx:dx,vy:dy,color:pick(PALETTE),tx,ty,life:0,trail:[]});
}

/** Detonate a shell at x,y using the active pattern. */
function burst(x,y,color){
  const kind=mode;
  const base=color;
  if(kind==='rings'){
    const rings=2;
    for(let r=0;r<rings;r++){
      const n=44, spd=2.4+r*1.5, col=r? pick(PALETTE):base;
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2;
        addSpark(x,y,Math.cos(a)*spd,Math.sin(a)*spd,col,rand(60,90));
      }
    }
  } else if(kind==='willow'){
    const n=90;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, spd=rand(1,4);
      addSpark(x,y,Math.cos(a)*spd,Math.sin(a)*spd,base,rand(90,130),0.04,true);
    }
  } else if(kind==='palm'){
    const n=10;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2, spd=rand(4,5.5), col=pick(PALETTE);
      addSpark(x,y,Math.cos(a)*spd,Math.sin(a)*spd,col,rand(70,100),0.05,false,true);
    }
  } else { // crackle
    const n=70;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, spd=rand(0.5,4.2);
      addSpark(x,y,Math.cos(a)*spd,Math.sin(a)*spd,pick(PALETTE),rand(40,70),G,false,false,true);
    }
  }
  flashes.push({x,y,r:0,color:base,life:0});
}

const flashes=[];

function addSpark(x,y,vx,vy,color,life,g=G,trail=false,palm=false,crackle=false){
  sparks.push({x,y,vx,vy,color,life,max:life,g,trail:trail?[]:null,palm,crackle,seed:Math.random()*100});
}

function hexToRgb(h){
  const n=parseInt(h.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
const rgbCache={};
function rgb(h){return rgbCache[h]||(rgbCache[h]=hexToRgb(h));}

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/16.67,2);
  last=now;

  // fade trails — pixel-block dark wash instead of full clear
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(24,13,24,0.22)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation='lighter';

  // rockets
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.life+=dt;
    r.x+=r.vx*dt;
    r.y+=r.vy*dt;
    r.vy+=G*dt;
    r.trail.push([r.x,r.y]);
    if(r.trail.length>8)r.trail.shift();
    // draw trail as hard pixel blocks
    for(let t=0;t<r.trail.length;t++){
      const [px,py]=r.trail[t];
      const a=t/r.trail.length;
      const [rr,gg,bb]=rgb(r.color);
      ctx.fillStyle=`rgba(${rr},${gg},${bb},${a*0.9})`;
      ctx.fillRect(Math.round(px)-1,Math.round(py)-1,3,3);
    }
    if(r.vy>=0){ // apex reached
      burst(r.x,r.y,r.color);
      rockets.splice(i,1);
    }
  }

  // flashes
  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];
    f.life+=dt;
    const p=f.life/10;
    if(p>=1){flashes.splice(i,1);continue;}
    const [rr,gg,bb]=rgb(f.color);
    ctx.fillStyle=`rgba(${rr},${gg},${bb},${(1-p)*0.5})`;
    const R=6+p*46;
    ctx.beginPath();ctx.arc(f.x,f.y,R,0,Math.PI*2);ctx.fill();
  }

  // sparks
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.life-=dt;
    if(s.life<=0){sparks.splice(i,1);continue;}
    s.vx*=AIR;s.vy*=AIR;
    s.vy+=s.g*dt;
    s.x+=s.vx*dt;s.y+=s.vy*dt;

    if(s.crackle && Math.random()<0.04*dt){
      s.vx+=rand(-1.4,1.4);s.vy+=rand(-1.4,1.4);
    }

    const t=s.life/s.max;
    let bright=t;
    // twinkle from seed
    bright*=0.72+0.28*Math.sin(now*0.02+s.seed*9);
    const [rr,gg,bb]=rgb(s.color);

    // willow: draw the drooping light-streak from recorded positions
    if(s.trail){
      s.trail.push([s.x,s.y]);
      if(s.trail.length>7)s.trail.shift();
      for(let k=0;k<s.trail.length;k++){
        const [px,py]=s.trail[k];
        const a=(k/s.trail.length)*bright*0.7;
        ctx.fillStyle=`rgba(${rr},${gg},${bb},${Math.max(0,a)})`;
        ctx.fillRect(Math.round(px),Math.round(py),2,2);
      }
    }

    ctx.fillStyle=`rgba(${rr},${gg},${bb},${Math.max(0,bright)})`;
    const sz=s.palm?3:2;
    ctx.fillRect(Math.round(s.x)-(sz>>1),Math.round(s.y)-(sz>>1),sz,sz);
  }

  pcEl.textContent=sparks.length+rockets.length;

  // auto show
  if(auto){
    autoTimer-=dt;
    if(autoTimer<=0){
      launch(rand(W*0.15,W*0.85),rand(H*0.12,H*0.45));
      autoTimer=rand(18,42);
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// interaction
let holding=false,holdTimer=0;
function toLocal(e){
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top];
}
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=toLocal(e);
  launch(x,y);
  holding=true;holdTimer=0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!holding)return;
  const [x,y]=toLocal(e);
  canvas._hx=x;canvas._hy=y;
});
canvas.addEventListener('pointerup',()=>holding=false);
canvas.addEventListener('pointercancel',()=>holding=false);
// barrage while held
setInterval(()=>{
  if(!holding)return;
  const r=canvas.getBoundingClientRect();
  const x=canvas._hx??W/2, y=canvas._hy??H*0.3;
  launch(x+rand(-40,40),y+rand(-30,30));
},170);

// controls
document.querySelectorAll('.chip[data-mode]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.chip[data-mode]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode=b.dataset.mode;
  });
});
const autoBtn=document.getElementById('auto');
autoBtn.addEventListener('click',()=>{
  auto=!auto;
  autoBtn.textContent='auto-show: '+(auto?'on':'off');
  autoBtn.classList.toggle('active',auto);
});

// opening salvo
setTimeout(()=>{launch(W*0.35,H*0.28);},250);
setTimeout(()=>{launch(W*0.62,H*0.22);},650);
</script>
</body>
</html>
